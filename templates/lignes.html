{% extends "base.html" %}

{% block sous_titre %}
<p class="entete-page__description">Choisir une ligne, voir ses arrêts et leurs correspondances, et repérer les arrêts de pivot.</p>
{% endblock %}

{% block contenu %}
<section class="carte barre-choix">
  <label class="etiquette-champ" for="recherche-ligne">Ligne de bus</label>
  <div id="emplacement-choix" class="barre-choix__champ"></div>
  <label class="case-a-cocher">
    <input type="checkbox" id="inclure-speciales">
    <span>Inclure le transport à la demande et les bus de remplacement</span>
  </label>
</section>
<div id="contenu-ligne" class="contenu-ligne"></div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/ecran-lignes.js') }}"></script>
{% endblock %}
