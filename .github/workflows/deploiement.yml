name: Déploiement sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Tests des calculs (JavaScript)
        run: node --test tests/js/*.test.mjs

      - name: Tests des pages et des données (Python)
        run: pytest

      - id: pages
        uses: actions/configure-pages@v6

      - name: Générer le site statique
        run: python figer.py
        env:
          URL_DE_BASE: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploiement:
    needs: construction
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
